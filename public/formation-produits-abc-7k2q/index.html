<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Formation produits ABC · Eric Di Martino</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Formation ABC">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Layout : appli mobile d'abord, une colonne de 720px max ; grilles à 2-3 colonnes sur tablette.
   Typo : Archivo condensé en capitales pour les titres (rappel des étiquettes ABC), Archivo normal pour le texte. */
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --ink:#151515; --muted:#66655F; --line:#E2E1DC;
  --accent:#151515; --on-accent:#FFFFFF; --ok:#2F7A4F; --ko:#B3412F;
  --tile-ink:#151515;
  --t-glow:#F2D7D9; --t-amplify:#D7E3D4; --t-hydrate:#D5E4EF; --t-curl:#CFE1E6;
  --t-repair:#EFEBC8; --t-all:#E7E2DD; --t-styling:#E9E7E3; --t-beyond:#ECE8E3;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}

*{box-sizing:border-box}
html,body{background:var(--bg);color-scheme:light}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-block:8px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,.disp{font-family:var(--display);font-stretch:68%;font-weight:800;text-transform:uppercase;letter-spacing:.005em;line-height:.92;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* barre du haut */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 18px}
.brand{font-family:var(--display);font-stretch:62%;font-weight:800;font-size:22px;line-height:.85;text-transform:uppercase;color:inherit;text-decoration:none;cursor:pointer}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.who input{width:120px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;color:var(--ink)}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:6px 0;font-weight:600;font-size:15px;cursor:pointer}
.back svg{width:18px;height:18px}

/* accueil */
.hero h1{font-size:clamp(44px,12vw,76px)}
.hero p{color:var(--muted);margin-top:12px;max-width:46ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-block:22px 26px}
.stat{background:var(--card);padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-stretch:70%;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;border:0;border-radius:var(--r);padding:14px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:var(--tile-ink);cursor:pointer;overflow:hidden;transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile img{align-self:flex-end;height:96px;width:auto;max-width:70%;object-fit:contain;margin:-2px -2px 8px 0;pointer-events:none}
.tile h3{font-size:30px;position:relative}
.tile small{position:relative;font-size:12.5px;font-weight:600}
.tile .bar{position:relative;height:4px;width:55%;background:rgba(0,0,0,.12);border-radius:4px;margin-top:6px}
.tile .bar i{display:block;height:100%;background:var(--tile-ink);border-radius:4px}
.tile[disabled]{cursor:default;opacity:.55}
.tile[disabled]:hover{transform:none}
.soon{position:relative;align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.7);padding:3px 8px;border-radius:999px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-block:30px 12px}
.sec-title h2{font-size:28px}

/* gamme */
.band{border-radius:calc(var(--r) + 4px);padding:20px 18px 18px;color:var(--tile-ink);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end;margin-top:6px}
.band h1{font-size:clamp(64px,19vw,110px)}
.band .sub{font-weight:600;margin-top:8px}
.band .scent{font-size:14px;margin-top:2px}
.band img{width:120px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid currentColor}
.band .chip{border-color:rgba(0,0,0,.35)}
.plist{display:grid;gap:10px}
@media(min-width:620px){.plist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pcard{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px 10px 10px;text-align:left;cursor:pointer;transition:border-color .15s}
.pcard:hover{border-color:var(--ink)}
.pcard .ph{background:var(--tint);border-radius:10px;aspect-ratio:1;display:grid;place-items:center;overflow:hidden}
.pcard .ph img{width:86%;height:86%;object-fit:contain}
.pcard .kind{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.pcard h3{font-size:24px;margin-top:3px}
.pcard p{font-size:14px;color:var(--muted);margin-top:4px}
.done{color:var(--ok);font-weight:700;letter-spacing:0;text-transform:none}
.routine{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.steps{display:flex;gap:0;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.step{flex:1 0 96px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;position:relative;border:0;background:none;cursor:pointer;padding:0 4px}
.step img{width:70px;height:70px;object-fit:contain;background:var(--tint);border-radius:50%;padding:6px}
.step b{font-size:13px;line-height:1.25}
.step span{font-size:12px;color:var(--muted)}
.step:not(:last-child)::after{content:"";position:absolute;top:35px;right:-10px;width:20px;border-top:1.5px dashed var(--muted)}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;padding:15px 20px;cursor:pointer;margin-top:18px}
.cta.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}

/* fiche */
.fhead{display:grid;gap:16px;margin-top:6px}
@media(min-width:620px){.fhead{grid-template-columns:300px minmax(0,1fr);align-items:end}}
.fimg{background:var(--tint);border-radius:calc(var(--r) + 4px);aspect-ratio:1/1;display:grid;place-items:center;max-width:100%}
.fimg img{width:82%;height:82%;object-fit:contain}
.fhead h1{font-size:clamp(46px,12vw,68px);margin-top:6px}
.fhead .en{font-size:14px;color:var(--muted);margin-top:8px}
.block{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.block h2{font-size:22px;margin-bottom:10px}
ul.ben{list-style:none;padding:0;margin:0;display:grid;gap:8px}
ul.ben li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px}
ul.ben li::before{content:"✓";width:18px;height:18px;margin-top:2px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:11px;font-weight:800;display:grid;place-items:center}
.free{display:flex;flex-wrap:wrap;gap:6px}
.free span{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.free span::before{content:"Sans ";font-weight:400;color:var(--muted)}
.pose{display:grid;gap:10px}
.pose div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:baseline}
.pose b{font-family:var(--display);font-stretch:70%;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.pose b small{font-size:16px;margin-left:2px}
.pose span{font-size:14.5px;color:var(--muted)}
.def{font-size:14.5px;border-left:3px solid var(--ink);padding-left:12px;margin-top:12px}
.def strong{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.tips{display:grid;gap:12px}
.tips p{font-size:15px}
.tips strong{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.pitch{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pitch h2{color:var(--bg)}
.pitch q{display:block;font-size:19px;line-height:1.4;quotes:"« " " »";font-weight:500}
.pitch .note{font-size:12.5px;opacity:.7;margin-top:10px}
.motion{position:relative;border-radius:var(--r);overflow:hidden;background:var(--tint);aspect-ratio:16/10;max-width:100%;display:grid;place-items:center;color:var(--tile-ink);margin-top:12px}
.motion .inner{display:grid;justify-items:center;gap:8px;text-align:center;padding:16px}
.motion .play{width:58px;height:58px;border-radius:50%;background:var(--tile-ink);display:grid;place-items:center}
.motion .play svg{width:22px;height:22px;fill:#fff;margin-left:3px}
.motion a{color:var(--tile-ink);font-weight:700}
.motion img{position:absolute;opacity:.18;width:70%;filter:grayscale(1)}
.motion .inner{position:relative}
.learn.is-done{background:var(--ok);color:#fff}

/* quiz */
.qwrap{margin-top:8px}
.qprog{display:flex;gap:4px;margin-block:12px 18px}
.qprog i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.qprog i.on{background:var(--ink)}
.qq{font-family:var(--display);font-stretch:72%;font-weight:800;text-transform:uppercase;font-size:clamp(30px,8vw,42px);line-height:.98;text-wrap:balance}
.opts{display:grid;gap:8px;margin-top:18px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;font-weight:600}
.opt .k{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px}
.opt.right{border-color:var(--ok);color:var(--ok)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--ko);color:var(--ko)}
.opt.wrong .k{background:var(--ko);border-color:var(--ko);color:#fff}
.opt[disabled]{cursor:default}
.expl{margin-top:14px;font-size:15px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.score{text-align:center;padding-block:20px}
.score b{display:block;font-family:var(--display);font-stretch:66%;font-weight:800;font-size:120px;line-height:.9;font-variant-numeric:tabular-nums}
.score p{color:var(--muted);margin-top:6px}

.view{animation:in .25s ease-out}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.view{animation:none}.tile{transition:none}}
.foot{margin-top:34px;font-size:12.5px;color:var(--muted);text-align:center}

@font-face{font-family:"Archivo";font-style:normal;font-weight:400 800;font-stretch:62% 125%;font-display:swap;src:url(fonts/archivo-latin.woff2) format("woff2")}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.motion-video{display:block;width:100%;max-width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:var(--r);background:var(--tint);margin-top:12px}
@media(min-width:620px){.motion-video{max-width:480px;margin-inline:auto}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="./" aria-label="Retour à l’accueil de l’appli">Authentic<br>Beauty<br>Concept</a>
    <label class="who" for="who">Prénom <input id="who" placeholder="Ex. Léa" autocomplete="given-name"></label>
  </header>
  <main id="app"></main>
  <p class="foot">Usage interne · Salons Eric Di Martino</p>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
